<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chunyang Wang has moved</title>
<meta name="description" content="This is Chunyang Wang's legacy page. The latest homepage is at home.chunyang-wang.workers.dev.">
<link rel="canonical" href="https://home.chunyang-wang.workers.dev/">
<meta name="robots" content="noindex, follow">
<noscript><meta http-equiv="refresh" content="0; url=https://home.chunyang-wang.workers.dev/"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --paper: #ffffff; --ink: #16181d; --slate: #666c76; --rule: #eceef1; --accent: #2430c8;
    --grain-rgb: 196, 200, 208; --water-rgb: 238, 240, 243; --phase-rgb: 36, 48, 200;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101216; --ink: #e7e9ee; --slate: #959ba6; --rule: #1f232a; --accent: #9aa6ff;
      --grain-rgb: 76, 81, 92; --water-rgb: 36, 40, 48; --phase-rgb: 74, 87, 230;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--serif);
    display: grid; place-items: center; padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(640px, 100%); }
  .name { font-family: var(--sans); font-size: 14px; color: var(--slate); margin: 0 0 18px; }
  h1 { font-size: clamp(26px, 5vw, 34px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; margin: 0 0 8px; }
  .lead { font-size: 18px; line-height: 1.5; color: var(--slate); margin: 0 0 28px; text-wrap: pretty; }
  .lead a { color: var(--ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  canvas { display: block; width: 100%; height: 120px; border-radius: 3px; background: rgb(var(--water-rgb)); }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 12px; font-family: var(--sans); font-size: 14px; color: var(--slate); }
  .meta a { color: var(--accent); text-decoration: none; font-weight: 500; white-space: nowrap; }
  .meta a:hover, .meta a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .status { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <p class="name">Chunyang Wang</p>
  <h1>This is the legacy page.</h1>
  <p class="lead">Taking you to the latest one at <a class="target" href="https://home.chunyang-wang.workers.dev/">home.chunyang-wang.workers.dev</a>.</p>
  <canvas aria-hidden="true"></canvas>
  <div class="meta">
    <span class="status" role="status">Redirecting once the fluid breaks through</span>
    <a class="target" href="https://home.chunyang-wang.workers.dev/">Go now</a>
  </div>
</main>
<script>
(() => {
  // Where to go. The old CV address maps to the new one; every other path goes to the new home page.
  const SITE = 'https://home.chunyang-wang.workers.dev';
  const moved = { '/assets/files/curriculum_vitae.pdf': '/files/cv.pdf' };
  const target = SITE + (moved[location.pathname] || '/') + location.hash;
  for (const a of document.querySelectorAll('a.target')) a.href = target;
  let gone = false;
  const go = () => { if (!gone) { gone = true; location.replace(target); } };

  const canvas = document.querySelector('canvas'), status = document.querySelector('.status');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DURATION = reduce ? 0 : 3600; // ms from first drop to breakthrough

  // The same drainage model as the homepage strip: grains on a grid, then invasion percolation.
  const SCALE = 2, INLET = 7 * SCALE;
  const W = Math.max(200, Math.round(canvas.clientWidth * SCALE)), H = 120 * SCALE, N = W * H;

  function rng(a) {
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const seed = (Math.random() * 1e9) | 0, rand = rng(seed);

  // Grains that never touch, then the distance from each pore cell to the nearest grain.
  const cell = 36, cols = Math.ceil(W / cell) + 2, rows = Math.ceil(H / cell) + 2;
  const buckets = Array.from({ length: cols * rows }, () => []), grains = [];
  const bi = (x, y) => (Math.floor(y / cell) + 1) * cols + Math.floor(x / cell) + 1;
  for (let i = 0; i < 40000; i++) {
    const r = 8 + Math.pow(rand(), 1.5) * 26, x = rand() * W, y = -8 + rand() * (H + 16);
    const loose = 0.5 + 0.5 * Math.sin(x / 140 + seed) * Math.cos(y / 50);
    const gap = 3.5 + Math.pow(rand(), 3) * 22 + loose * 7, b = bi(x, y);
    let ok = true;
    for (let dy = -2; dy <= 2 && ok; dy++) for (let dx = -2; dx <= 2 && ok; dx++) {
      const k = b + dy * cols + dx; if (k < 0 || k >= buckets.length) continue;
      for (const g of buckets[k]) if (Math.hypot(g.x - x, g.y - y) < g.r + r + gap) { ok = false; break; }
    }
    if (ok) { const g = { x, y, r }; buckets[b].push(g); grains.push(g); }
  }
  const rad = new Float32Array(N).fill(40), REACH = 40;
  for (const g of grains) {
    const x0 = Math.max(0, Math.floor(g.x - g.r - REACH)), x1 = Math.min(W - 1, Math.ceil(g.x + g.r + REACH));
    const y0 = Math.max(0, Math.floor(g.y - g.r - REACH)), y1 = Math.min(H - 1, Math.ceil(g.y + g.r + REACH));
    for (let y = y0; y <= y1; y++) {
      const dy = y - g.y, row = y * W;
      for (let x = x0; x <= x1; x++) { const e = Math.sqrt((x - g.x) * (x - g.x) + dy * dy) - g.r; if (e < rad[row + x]) rad[row + x] = e; }
    }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < INLET; x++) { const i = y * W + x; rad[i] = Math.max(rad[i], INLET - x + 1); }

  // Invasion percolation: the fluid always enters the widest open pore next.
  // Run it to breakthrough up front and record when each cell filled, then replay it on a clock.
  const keys = [], vals = [];
  const push = (k, v) => {
    keys.push(k); vals.push(v); let i = keys.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (keys[p] >= keys[i]) break; [keys[p], keys[i]] = [keys[i], keys[p]]; [vals[p], vals[i]] = [vals[i], vals[p]]; i = p; }
  };
  const pop = () => {
    const top = vals[0], lk = keys.pop(), lv = vals.pop();
    if (keys.length) {
      keys[0] = lk; vals[0] = lv; let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < keys.length && keys[l] > keys[m]) m = l;
        if (r < keys.length && keys[r] > keys[m]) m = r;
        if (m === i) break;
        [keys[m], keys[i]] = [keys[i], keys[m]]; [vals[m], vals[i]] = [vals[i], vals[m]]; i = m;
      }
    }
    return top;
  };
  const time = new Int32Array(N).fill(-1), queued = new Uint8Array(N);
  const visit = (j) => { if (rad[j] > 0 && time[j] < 0 && !queued[j]) { queued[j] = 1; push(rad[j], j); } };
  const around = (i) => { const x = i % W; if (x > 0) visit(i - 1); if (x < W - 1) visit(i + 1); if (i >= W) visit(i - W); if (i + W < N) visit(i + W); };
  for (let y = 0; y < H; y++) for (let x = 0; x < INLET; x++) { const i = y * W + x; if (rad[i] > 0) { time[i] = 0; queued[i] = 1; } }
  for (let y = 0; y < H; y++) around(y * W + INLET - 1);
  let pressure = 0, frame = 0, done = false;
  while (!done && keys.length) {
    frame++;
    let n = 0;
    while (keys.length && 1 / keys[0] <= pressure && n < 190) {
      const i = pop(); time[i] = frame; n++;
      if (i % W === W - 1) done = true;
      around(i);
    }
    if (n === 0 && keys.length) pressure += Math.max(0.0025, (1 / keys[0] - pressure) * 0.1);
  }
  const LAST = frame;

  // Paint: grains shaded by depth, the invading fluid with a bright meniscus at its front.
  const ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;
  const img = ctx.createImageData(W, H), d = img.data;
  const rgb = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).split(',').map(Number);
  let water, grain, phase;
  const colours = () => { water = rgb('--water-rgb'); grain = rgb('--grain-rgb'); phase = rgb('--phase-rgb'); };
  colours();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', colours);
  const wet = (j, f) => time[j] < 0 || time[j] > f;
  function paint(f) {
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const r = rad[i];
      if (r <= 0) {
        const k = 0.86 + 0.14 * Math.min(-r / 7, 1);
        d[p] = grain[0] * k; d[p + 1] = grain[1] * k; d[p + 2] = grain[2] * k;
      } else if (time[i] >= 0 && time[i] <= f) {
        const x = i % W;
        const rim = (x > 0 && rad[i - 1] > 0 && wet(i - 1, f)) || (x < W - 1 && rad[i + 1] > 0 && wet(i + 1, f)) ||
          (i >= W && rad[i - W] > 0 && wet(i - W, f)) || (i + W < N && rad[i + W] > 0 && wet(i + W, f));
        const t = rim ? 0.42 : Math.min(r / 12, 1) * 0.1;
        d[p] = phase[0] + (255 - phase[0]) * t; d[p + 1] = phase[1] + (255 - phase[1]) * t; d[p + 2] = phase[2] + (255 - phase[2]) * t;
      } else { d[p] = water[0]; d[p + 1] = water[1]; d[p + 2] = water[2]; }
      d[p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  // Replay on a clock, easing out so the last stretch to the far side reads as the finish.
  const start = performance.now();
  const ease = (t) => 1 - Math.pow(1 - t, 1.6);
  function tick(now) {
    const t = DURATION ? Math.min((now - start) / DURATION, 1) : 1;
    paint(Math.round(ease(t) * LAST));
    if (t < 1) { requestAnimationFrame(tick); return; }
    status.textContent = 'Redirecting';
    setTimeout(go, reduce ? 900 : 350);
  }
  requestAnimationFrame(tick);
  // If frames stall, for example in a background tab, still move on.
  setTimeout(go, DURATION + 2500);
})();
</script>
</body>
</html>
